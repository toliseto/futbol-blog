<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Saha | Futbol Blogu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
<script src="https://collie-activate-grumbly.ngrok-free.dev"></script>
  <header class="scoreboard">
    <div class="scoreboard__inner">
      <div class="scoreboard__brand">
        <span class="scoreboard__dot"></span>
        SAHA
      </div>
      <nav class="scoreboard__nav">
        <button class="nav-link is-active" data-view="list">Yazılar</button>
        <button class="nav-link auth-req" data-view="new" hidden>Yeni Yazı</button>
        <button class="nav-link guest-req" data-view="login">Giriş Yap</button>
        <button class="nav-link guest-req" data-view="register">Kayıt Ol</button>
        <button class="nav-link admin-req" data-view="admin" hidden>Admin Paneli</button>
        <button class="nav-link auth-req" id="logout-btn" hidden>Çıkış Yap</button>
      </nav>
    </div>
  </header>

  <main class="pitch">

    <section id="view-list" class="view">
      <div class="pitch__intro">
        <h1>Sahadan Notlar</h1>
        <p>Maç analizleri, transfer gündemi ve taktik yazıları — hepsi tek sahada.</p>
      </div>

      <div id="posts-grid" class="posts-grid">
        <p class="status-text">Yazılar yükleniyor…</p>
      </div>
    </section>

    <section id="view-detail" class="view" hidden>
      <button class="back-link" id="back-to-list">← Yazılara dön</button>
      <article id="post-detail" class="post-detail"></article>
    </section>

    <section id="view-new" class="view" hidden>
      <h1>Yeni Yazı Ekle</h1>
      <form id="new-post-form" class="post-form">
        <label>
          Başlık
          <input type="text" name="title" required maxlength="200" />
        </label>
        <label>
          İçerik
          <textarea name="content" rows="8" required></textarea>
        </label>
        <label>
          Görsel URL (opsiyonel)
          <input type="url" name="image_url" placeholder="https://..." />
        </label>
        <button type="submit" class="btn-primary">Yayınla</button>
        <p id="form-status" class="status-text"></p>
      </form>
    </section>

    <section id="view-login" class="view" hidden>
      <h1>Giriş Yap</h1>
      <form id="login-form" class="post-form">
        <label>Kullanıcı Adı<input type="text" name="username" required /></label>
        <label>Şifre<input type="password" name="password" required /></label>
        <button type="submit" class="btn-primary">Giriş Yap</button>
        <p id="login-status" class="status-text"></p>
      </form>
    </section>

    <section id="view-register" class="view" hidden>
      <h1>Kayıt Ol</h1>
      <form id="register-form" class="post-form">
        <label>Kullanıcı Adı<input type="text" name="username" required /></label>
        <label>Şifre<input type="password" name="password" required /></label>
        <button type="submit" class="btn-primary">Kayıt Ol</button>
        <p id="register-status" class="status-text"></p>
      </form>
    </section>

    <section id="view-admin" class="view" hidden>
      <h1>Admin Paneli</h1>
      <div class="admin-panel" style="margin-top:20px;">
        <h2>Kayıtlı Kullanıcılar</h2>
        <div id="users-list">Yükleniyor...</div>
      </div>
    </section>

  </main>

  <footer class="site-footer">
    <p>90+3' — Saha, basit bir futbol blogu denemesidir.</p>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
